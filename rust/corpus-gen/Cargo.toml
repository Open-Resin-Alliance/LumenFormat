[package]
name = "lumen-corpus-gen"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generates the LUMEN conformance corpus from the specification, without using the reference crate"

[dependencies]
serde_json = "1"
zstd = "0.13"
crc32c = "0.6"
sha2 = "0.10"
sha3 = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
aes-kw = "0.2"
argon2 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
