name: CI

# The specification, the conformance corpus and the Rust implementation are one
# artifact: the crate's tests read the corpus, and the corpus is the contract the
# specification publishes. A change to any of them is a change to what has to keep
# working, so any of them triggers this.
on:
  push:
    paths:
      - "rust/**"
      - "test-vectors/**"
      - "spec/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "test-vectors/**"
      - "spec/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints, the full test suite, and the packaging path an actual
  # release goes through. `--locked` throughout, because the committed workspace
  # lock is what CI reproduces and what the declared minimum version is verified
  # against.
  rust:
    name: Format, lint, test and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Formatting
        run: cargo +stable fmt --all --check

      # clippy carries rustc's own lints too, so this is the one gate that has to
      # stay at zero warnings - across all three crates, since the corpus tools are
      # as load-bearing as the library. Nothing sets RUSTFLAGS globally: that would
      # apply to dependency builds, where another crate's warning is not our failure.
      - name: Lints
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      # Unit, corpus conformance, round trip and doc tests. The conformance tests
      # read test-vectors/ beside the workspace, which is why they run here.
      - name: Tests
        run: cargo +stable test --workspace --locked

      # The step that caught two real defects before the first release: a crate
      # that cannot package, or whose tests cannot run once unpacked, is not
      # publishable even when its tests pass in the working directory.
      - name: The crate packages and verifies
        run: cargo +stable publish -p lumen-format --dry-run --locked

  # The declared rust-version is a claim about consumers, so it is checked the
  # same way the stable job is checked: the whole suite, against the same lock.
  # Only the published crate carries the claim; the corpus tools are not shipped.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Tests on the declared floor
        run: cargo +1.85.0 test -p lumen-format --locked

  # DragonFruit builds this crate for its webview, so the wasm target is a real
  # consumer requirement rather than a nicety. zstd compiles C, so the host needs
  # clang; it is installed explicitly instead of assumed from the image.
  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - name: Install the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Check the DragonFruit target
        run: cargo +stable check -p lumen-format --lib --locked --target wasm32-unknown-unknown

  # Three independent readings of the specification, checked against each other.
  # The generator, the validator and the crate share no code, so:
  #   - the committed corpus must be exactly what the generator produces,
  #   - that corpus must validate under the specification's own reader, and
  #   - files the crate writes must pass that same reader.
  # No single one of those is provable by the crate's own tests.
  corpus:
    name: Corpus and cross-implementation check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # The vectors are generated artifacts, so the repository's own rule for them
      # is the gate: regenerate, and require the tree to come back unchanged. This
      # is what would catch a hand-edited vector, or a generator that drifted from
      # the files it is supposed to produce.
      - name: The committed corpus is what the generator produces
        run: |
          cargo +stable run --release --locked -p lumen-corpus-gen --bin make_vectors
          git diff --exit-code -- test-vectors

      - name: The committed corpus validates
        run: cargo +stable run --release --locked -p lumen-corpus --bin verify_vectors

      - name: Generate a file with the crate
        run: |
          cargo +stable run --locked -p lumen-format --example make_test_file -- "$RUNNER_TEMP/sample"

      - name: Validate the crate's output with the corpus reader
        run: cargo +stable run --release --locked -p lumen-corpus --bin cross_check -- "$RUNNER_TEMP/sample"
